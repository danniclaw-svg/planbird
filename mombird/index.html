<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-title" content="MomBird">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12203A">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<title>MomBird</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Una columna de 760px. El marcador amarillo resalta lo que vence en menos de 48 horas. */
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#12203A; --muted:#566277; --line:#D8DEE8;
  --hi:#FFD93D; --hi-ink:#12203A; --btn:#12203A; --btn-ink:#FFFFFF; --focus:#2058C9; --danger:#B83232;
  --t-examen:#B83232; --t-entrega:#955C00; --t-reunion:#2058C9; --t-sin_clases:#1E7556; --t-evento:#6B3FC0; --t-tramite:#4A5568; --t-otro:#566277;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524; --surface:#162033; --surface-2:#1B2840; --ink:#E7ECF5; --muted:#9AA7BD; --line:#2A3853;
    --btn:#FFD93D; --btn-ink:#12203A; --focus:#7FA8FF; --danger:#FF8A8A;
    --t-examen:#FF8A8A; --t-entrega:#F2B84B; --t-reunion:#7FA8FF; --t-sin_clases:#5FD3A8; --t-evento:#B79BFF; --t-tramite:#A9B6CC; --t-otro:#9AA7BD;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#162033; --surface-2:#1B2840; --ink:#E7ECF5; --muted:#9AA7BD; --line:#2A3853;
  --btn:#FFD93D; --btn-ink:#12203A; --focus:#7FA8FF; --danger:#FF8A8A;
  --t-examen:#FF8A8A; --t-entrega:#F2B84B; --t-reunion:#7FA8FF; --t-sin_clases:#5FD3A8; --t-evento:#B79BFF; --t-tramite:#A9B6CC; --t-otro:#9AA7BD;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 96px}
.t-examen{--c:var(--t-examen)} .t-entrega{--c:var(--t-entrega)} .t-reunion{--c:var(--t-reunion)}
.t-sin_clases{--c:var(--t-sin_clases)} .t-evento{--c:var(--t-evento)} .t-tramite{--c:var(--t-tramite)} .t-otro{--c:var(--t-otro)}

h1{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,8vw,46px);line-height:1;margin:0 0 6px;letter-spacing:-.01em}
.whose{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin:0 0 16px;font-size:17px;color:var(--muted)}
.whose input.kid[readonly]{border-bottom-color:transparent;pointer-events:none}
.whose input.kid{font:inherit;font-weight:700;border:0;border-bottom:3px solid var(--hi);background:transparent;padding:0 2px;min-height:0;width:min(100%,11em);min-width:5em;border-radius:0;color:var(--ink)}
.kid::placeholder{color:var(--muted);font-weight:500}
.summary{font-size:19px;line-height:1.4;margin:0 0 4px;max-width:34em}
.next-up{margin:0 0 18px;color:var(--muted);font-size:15px}
.hl{background:var(--hi);color:var(--hi-ink);padding:.02em .32em;border-radius:3px;font-weight:600;-webkit-box-decoration-break:clone;box-decoration-break:clone}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;font-size:15px;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.notice{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 16px;font-size:14px;color:var(--muted)}
.notice b{color:var(--ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 16px}
.panel h2{font-family:var(--font-display);font-size:20px;margin:0 0 4px}
.panel .sub{margin:0 0 12px;color:var(--muted);font-size:14px}
.files{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.files li{display:flex;gap:10px;align-items:baseline;font-size:14px;flex-wrap:wrap}
.files .nm{font-weight:600;word-break:break-all}
.st{font-size:13px;color:var(--muted)} .st.ok{color:var(--t-sin_clases)} .st.err{color:var(--danger)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.rv-list{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.rv{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;padding:10px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;background:var(--surface-2)}
.rv.off{opacity:.55}
.rv .f{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rv input[type=text]{flex:1 1 200px;min-width:0}
.rv .flag{font-size:12px;font-weight:600;color:var(--danger)}
.rv .flag.dup{color:var(--muted)}
.rv input[type=checkbox]{width:20px;height:20px;margin-top:8px;accent-color:var(--ink)}
input[type=text],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;min-height:38px;color:var(--ink)}
textarea{width:100%;min-height:72px;resize:vertical}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hi)}

.grp{font-family:var(--font-display);font-size:15px;font-weight:800;margin:22px 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.grp span{font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:14px}
.grp.warn{color:var(--danger)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:grid;grid-template-columns:30px 48px 1fr auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px 10px 10px 8px}
.row.done .ttl{text-decoration:line-through;color:var(--muted)}
.row.past:not(.done){opacity:.7}
.chk{width:26px;height:26px;border-radius:7px;border:2px solid var(--muted);background:transparent;padding:0;display:grid;place-items:center;margin-top:2px}
.chk[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.chk[aria-pressed="true"]::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.dt{text-align:center;line-height:1.05;padding-top:2px}
.dt b{display:block;font-family:var(--font-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.dt small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.ttl{font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:3px;font-size:13px;color:var(--muted)}
.chip{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}
.notes{margin-top:5px;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.edit{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:6px 8px;border-radius:6px;text-decoration:underline}
.acts{display:flex;flex-direction:column;align-items:flex-end}
a.edit{color:var(--muted);font-size:13px;font-weight:600;padding:6px 8px;text-decoration:underline;display:inline-block}
.empty{text-align:left}
.empty h2{font-size:24px}
.empty ol{margin:14px 0 0;padding-left:20px;color:var(--muted)}
.empty .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.allok{padding:18px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;color:var(--muted)}

.cal-head{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.cal-head h2{font-family:var(--font-display);font-size:20px;margin:0;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
.day{aspect-ratio:1/1.05;min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left}
.day.blank{border:0;background:transparent;pointer-events:none}
.day .n{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.day.today .n{background:var(--hi);color:var(--hi-ink);border-radius:5px;padding:0 5px}
.day.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.dots{display:flex;flex-wrap:wrap;gap:3px;align-items:center;font-size:11px;color:var(--muted)}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c);display:block}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.fbar input[type=search]{flex:1 1 200px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:38px}
.src{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.src b{overflow-wrap:anywhere}

#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:rgba(10,16,30,.55)}
.dlg{position:relative;background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;width:min(520px,100%);max-height:92%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.dlg h2{font-family:var(--font-display);margin:0 0 12px;font-size:21px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form input,.form select,.form textarea{width:100%;font-weight:400;color:var(--ink)}
.dlg .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.dlg .btns .left{margin-right:auto}
.dlg p{margin:0 0 8px}
.dlg ol{margin:6px 0 0;padding-left:20px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#dropveil{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--hi) 85%,transparent);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--hi-ink);text-align:center;padding:24px}
.loading{padding:28px 0;color:var(--muted)}
.row.note{grid-template-columns:30px 1fr auto}
.hintrow{margin:0 0 14px}
.hintrow input{width:100%}
.rv select.kind{font-weight:600}
.rv .dis{opacity:.45}
@media (max-width:480px){
  .row.note{grid-template-columns:28px 1fr}
  .row.note .acts{grid-column:2}
  .row{grid-template-columns:28px 40px 1fr;}
  .row .acts{grid-column:3;flex-direction:row;align-items:center;gap:6px}
  .row .acts .edit{padding-left:0}
  .dt b{font-size:21px}
  .summary{font-size:17px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>MomBird</h1>
  <p class="whose"><label for="kid">Agenda escolar de</label> <input id="kid" class="kid" type="text" placeholder="tu hijo o hija" autocomplete="off" maxlength="40"></p>
  <p class="summary" id="summary"></p>
  <p class="next-up" id="nextup"></p>

  <div class="toolbar" id="toolbar">
    <button class="btn primary" data-act="pick" id="b-pick">Subir PDF, foto o captura</button>
    <button class="btn" data-act="add">Agregar actividad</button>
    <button class="btn" data-act="addnote">Agregar pendiente</button>
    <button class="btn" data-act="copy" id="b-copy">Copiar próximos 7 días</button>
    <button class="btn" data-act="share" id="b-share" hidden>Compartir</button>
    <button class="btn" data-act="export" id="b-export">Exportar a Google Calendar</button>
    <input type="file" id="file" accept="application/pdf,image/*" multiple hidden>
  </div>

  <div class="hintrow" id="hintrow" hidden><input type="text" id="hint" maxlength="400" placeholder="Indicaciones opcionales (ej.: lo de comprar va a pendientes)" aria-label="Indicaciones opcionales para Claude" autocomplete="off"></div>

  <div id="notice"></div>
  <div id="import"></div>

  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view" role="tabpanel"></div>
</div>

<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="dropveil" hidden>Suelta aquí los PDF, fotos o capturas de conversaciones</div>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const today=()=>ymd(new Date());
const validDate=s=>typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&ymd(parse(s))===s;
const validTime=s=>typeof s==="string"&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const F={
  long:new Intl.DateTimeFormat("es",{weekday:"long",day:"numeric",month:"long"}),
  short:new Intl.DateTimeFormat("es",{day:"numeric",month:"short"}),
  wd:new Intl.DateTimeFormat("es",{weekday:"short"}),
  wdLong:new Intl.DateTimeFormat("es",{weekday:"long"}),
  month:new Intl.DateTimeFormat("es",{month:"long",year:"numeric"})
};
const TYPES=[
  {id:"examen",one:"examen",many:"exámenes",label:"Examen"},
  {id:"entrega",one:"entrega",many:"entregas",label:"Entrega"},
  {id:"reunion",one:"reunión",many:"reuniones",label:"Reunión"},
  {id:"sin_clases",one:"día sin clases",many:"días sin clases",label:"Sin clases"},
  {id:"evento",one:"actividad",many:"actividades",label:"Actividad"},
  {id:"tramite",one:"trámite",many:"trámites",label:"Trámite"},
  {id:"otro",one:"otro",many:"otros",label:"Otro"}
];
const T=Object.fromEntries(TYPES.map(t=>[t.id,t]));
const endOf=e=>e.endDate||e.date;
const cmp=(a,b)=>a.date<b.date?-1:a.date>b.date?1:((a.time||"")<(b.time||"")?-1:(a.time||"")>(b.time||"")?1:String(a.title).localeCompare(String(b.title),"es"));
const weekEnd=s=>{const dow=(parse(s).getDay()+6)%7;return addDays(s,6-dow)};
const joinEs=a=>a.length<=1?a.join(""):a.slice(0,-1).join(", ")+" y "+a[a.length-1];
const plural=(n,a,b)=>n===1?a:b;
function relLabel(e){
  const t=today(),end=endOf(e);
  if(e.date<t&&end>=t) return end===t?"termina hoy":"hasta el "+F.short.format(parse(end));
  const d=diffDays(e.date,t);
  if(d<0) return "hace "+(-d)+" "+plural(-d,"día","días");
  if(d===0) return "hoy"; if(d===1) return "mañana";
  if(d<7) return "en "+d+" días";
  return F.short.format(parse(e.date));
}

/* ---------- estado ---------- */
const S={events:[],sources:[],kid:"",loading:true,slow:false,mode:"",tab:"next",month:today().slice(0,8)+"01",selDay:today(),
  filter:{type:"all",status:"pending",q:""},imp:null,demo:false,demoEvents:[],canAI:false,imgMax:0,canDl:false,shared:[],own:[],done:{},sharedKid:"",sharedAt:0,shareUrl:""};
const HOSTED=!(window.claude&&typeof window.claude.use==="function");
const SHARE_BASE="https://danniclaw-svg.github.io/planbird/mombird/";
let sampleFn=null,dlFn=null;
const PDFW="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
function loadPdfJs(){return new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
const hostedEvents=()=>S.shared.map(e=>Object.assign({},e,{shared:true,done:!!S.done[e.id]})).concat(S.own);
const rawEvs=()=>S.demo?S.demoEvents:(HOSTED?hostedEvents():S.events);
const evs=()=>rawEvs().filter(e=>validDate(e.date));
const pend=()=>rawEvs().filter(e=>!validDate(e.date));
const openPend=()=>pend().filter(e=>!e.done);

/* ---------- almacenamiento ---------- */
const LS="agenda-escolar-v1";
const newId=()=>"e"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function lsLoad(){try{const j=JSON.parse(localStorage.getItem(LS)||"null");if(j){S.events=j.events||[];S.sources=j.sources||[];S.kid=j.kid||""}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({events:S.events,sources:S.sources,kid:S.kid}))}catch(e){}}
const localOps={
  async addEvent(d){const e=Object.assign({},d,{id:newId()});S.events=S.events.concat([e]);lsSave();render();return e.id},
  async patchEvent(id,p){S.events=S.events.map(e=>e.id===id?Object.assign({},e,p):e);lsSave();render()},
  async removeEvent(id){S.events=S.events.filter(e=>e.id!==id);lsSave();render()},
  async addSource(d){const s=Object.assign({},d,{id:newId()});S.sources=S.sources.concat([s]);lsSave();render();return s.id},
  async removeSource(id){S.sources=S.sources.filter(s=>s.id!==id);lsSave();render()},
  async saveKid(n){S.kid=n;lsSave()}
};
const demoOps={
  async addEvent(d){const e=Object.assign({},d,{id:newId()});S.demoEvents=S.demoEvents.concat([e]);render();return e.id},
  async patchEvent(id,p){S.demoEvents=S.demoEvents.map(e=>e.id===id?Object.assign({},e,p):e);render()},
  async removeEvent(id){S.demoEvents=S.demoEvents.filter(e=>e.id!==id);render()},
  async addSource(){return newId()},async removeSource(){},async saveKid(){}
};
const H_KEY="mombird-v1";
function hLoad(){try{const j=JSON.parse(localStorage.getItem(H_KEY)||"null");if(j){S.shared=j.shared||[];S.own=j.own||[];S.done=j.done||{};S.sharedKid=j.sharedKid||"";S.sharedAt=j.sharedAt||0;S.kid=S.sharedKid}}catch(e){}}
function hSave(){try{localStorage.setItem(H_KEY,JSON.stringify({shared:S.shared,own:S.own,done:S.done,sharedKid:S.sharedKid,sharedAt:S.sharedAt}))}catch(e){}}
const hostedOps={

async function guard(fn){
  try{return await fn()}catch(e){
    if(e&&e.code==="unavailable"){await sleep(400+Math.random()*400);try{return await fn()}catch(e2){e=e2}}
    toast(dbMsg(e));throw e;
  }
}
function makeDbOps(db,uid){
  const base=db.doc("data/users/"+uid+"/profile");
  const ev=base.collection("events"),src=base.collection("sources");
  const onErr=()=>{S.loading=false;S.slow=true;render()};
  return {
    async addEvent(d){return guard(async()=>{const r=ev.doc();await r.set(clean(d));return r.id})},
    async patchEvent(id,p){return guard(()=>ev.doc(id).update(clean(p)))},
    async removeEvent(id){return guard(()=>ev.doc(id).delete())},
    async addSource(d){return guard(async()=>{const r=src.doc();await r.set(clean(d));return r.id})},
    async removeSource(id){return guard(()=>src.doc(id).delete())},
    async saveKid(n){return guard(()=>base.set({kid:n}))},
    subscribe(){
      base.onSnapshot(s=>{S.kid=s.exists?(s.data().kid||""):"";render()},onErr);
      ev.onSnapshot(s=>{S.events=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.loading=false;S.slow=false;render()},onErr);
      src.onSnapshot(s=>{S.sources=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()},onErr);
    }
  };
}

function errMsg(e){
  const c=e&&e.code;
  if(c==="nopdf")return "No se pudo cargar el lector de PDF. Revisa tu conexión.";
  if(c==="scanned")return "El PDF parece escaneado y esta vista no puede enviar imágenes. Prueba con una foto o un PDF con texto.";
  if(c==="noimg")return "Esta vista no puede enviar imágenes a Claude.";
  if(c==="not_granted")return "Para leer los archivos, permite que esta página use Claude.";
  if(c==="rate_limited")return "Muchas solicitudes seguidas. Espera un momento y vuelve a intentar.";
  if(c==="prompt_too_large")return "El archivo es demasiado grande. Sube menos páginas.";
  if(c==="invalid_json")return "No pude leer la respuesta. Intenta de nuevo.";
  if(c==="cancelled")return "Cancelado.";
  if(c==="image_rejected")return "No pude usar esa imagen. Prueba con otra.";
  return "Algo falló al analizar el archivo. Intenta de nuevo.";
}
function itemsToText(items){
  let out="",line="",last=null;
  items.forEach(it=>{
    const y=it.transform?it.transform[5]:0;
    if(last!==null&&Math.abs(y-last)>3){out+=line.trim()+"\n";line=""}
    line+=it.str+" ";last=y;
  });
  return out+line.trim()+"\n";
}
async function renderPages(pdf,n){
  const out=[];
  for(let p=1;p<=n;p++){
    const pg=await pdf.getPage(p),vp=pg.getViewport({scale:1.5});
    const c=document.createElement("canvas");c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
    const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:ctx,viewport:vp}).promise;
    out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.82)));
  }
  return out;
}

  (text?"\nTEXTO DEL DOCUMENTO:\n"+text.slice(0,150000):"");

function normalizeEvents(out){
  const arr=Array.isArray(out)?out:(out&&Array.isArray(out.events)?out.events:[]);
  const res=[];
  arr.forEach(x=>{
    if(!x||typeof x.title!=="string"||!x.title.trim())return;
    const title=x.title.trim().slice(0,120),type=T[x.type]?x.type:"otro",notes=typeof x.notes==="string"?x.notes.trim().slice(0,400):"";
    if(x.kind!=="pendiente"&&validDate(x.date)){
      const end=validDate(x.endDate)&&x.endDate>x.date?x.endDate:null;
      res.push({kind:"evento",title,date:x.date,endDate:end,time:validTime(x.time)?x.time:"",type,notes,uncertain:!!x.uncertain});
    }else{
      res.push({kind:"pendiente",title,date:"",endDate:null,time:"",type,notes,uncertain:false,dg:x.kind!=="pendiente"});
    }
  });
  return res;
}
async function shrinkImg(f){
  try{
    if(!window.createImageBitmap||(f.size<1500000&&/jpeg|webp/.test(f.type)))return f;
    const bm=await createImageBitmap(f),k=Math.min(1,2000/Math.max(bm.width,bm.height));
    if(k===1&&f.size<2500000){bm.close&&bm.close();return f}
    const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
    const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(bm,0,0,c.width,c.height);bm.close&&bm.close();
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.88));
    return b||f;
  }catch(e){return f}
}
async function processFile(job,row,signal){
  row.st="read";render();
  let text="",imgs=[],warn="";
  if(job.pdf){
    const file=job.pdf;
    if(!window.pdfjsLib){try{await loadPdfJs()}catch(e){throw {code:"nopdf"}}}if(!window.pdfjsLib)throw {code:"nopdf"};
    pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    const pages=pdf.numPages,maxP=Math.min(pages,60);
    for(let p=1;p<=maxP;p++){
      const pg=await pdf.getPage(p),tc=await pg.getTextContent();
      text+="\n=== Página "+p+" ===\n"+itemsToText(tc.items);
    }
    const dense=text.replace(/=== Página \d+ ===|\s/g,"").length,scanned=dense<40*maxP;
    const capImg=Math.min(S.imgMax,10);
    if(capImg>0&&(scanned||maxP<=capImg)){
      const n=Math.min(maxP,capImg);imgs=await renderPages(pdf,n);
      if(maxP>n)warn="Solo se analizaron las primeras "+n+" páginas.";
    }else if(scanned)throw {code:"scanned"};
    if(pages>60)warn="Solo se leyeron las primeras 60 páginas.";
    row.pages=pages;
    try{pdf.destroy()}catch(e){}
  }else{
    if(!S.imgMax)throw {code:"noimg"};
    imgs=[];for(const f of job.imgs)imgs.push(await shrinkImg(f));
    row.pages=imgs.length;
  }
  if(signal.aborted)throw {code:"cancelled"};
  row.st="ai";render();
  const opts={signal,modelTier:"default"};
  if(imgs.length)opts.images=imgs;
  const out=await sampleFn.json(buildPrompt(job.name,text,imgs.length>0,job.hint),opts);
  row.items=normalizeEvents(out);
  const note=out&&typeof out.notes==="string"?out.notes.trim():"";
  row.st="ok";
  const np=row.items.filter(x=>x.kind==="pendiente").length,ne=row.items.length-np;
  row.msg=ne+" "+plural(ne,"actividad","actividades")+(np?" y "+np+" "+plural(np,"pendiente","pendientes"):"")+(note?" · "+note:"")+(warn?" · "+warn:"");
}
async function handleFiles(files){
  if(!S.canAI){toast("Esta vista no puede analizar archivos con Claude.");return}
  if(S.imp&&S.imp.busy){toast("Ya hay archivos en proceso.");return}
  const list=[...files].filter(f=>isPdf(f)||isImg(f));
  if(!list.length){toast("Sube archivos PDF o imágenes (JPG, PNG).");return}
  if(S.demo)S.demo=false;
  const hintEl=$("#hint"),hint=hintEl?hintEl.value.trim().slice(0,400):"";
  const jobs=[];
  list.filter(isPdf).forEach(f=>jobs.push({name:f.name,kind:"pdf",pdf:f,imgs:[],hint}));
  const pics=list.filter(f=>!isPdf(f)),chunk=Math.max(1,Math.min(S.imgMax||1,10));
  const parts=Math.ceil(pics.length/chunk);
  for(let i=0;i<pics.length;i+=chunk){
    const g=pics.slice(i,i+chunk),k=i/chunk+1;
    const nm=pics.length===1?pics[0].name:"Capturas o fotos ("+pics.length+")"+(parts>1?" · parte "+k+" de "+parts:"");
    jobs.push({name:nm,kind:"imagen",pdf:null,imgs:g,hint});
  }
  if(hintEl)hintEl.value="";
  const ctl=new AbortController();
  S.imp={rows:jobs.map((j,i)=>({id:"f"+i,name:j.name,kind:j.kind,st:"wait",msg:"",items:[],pages:0})),review:null,busy:true,ctl,saving:false};
  render();
  for(let i=0;i<jobs.length;i++){
    const row=S.imp.rows[i];
    if(ctl.signal.aborted){row.st="err";row.msg="Cancelado.";continue}
    try{await processFile(jobs[i],row,ctl.signal)}catch(e){row.st="err";row.msg=errMsg(e);console.warn(e)}
    render();
  }
  const have=new Set(S.events.map(e=>(validDate(e.date)?e.date:"")+"|"+norm(e.title)));
  const rv=[];
  S.imp.rows.forEach(r=>r.items.forEach(it=>{
    const dup=have.has((it.kind==="pendiente"?"":it.date)+"|"+norm(it.title));
    rv.push(Object.assign({},it,{src:r.id,srcName:r.name,dup,on:!dup,pdate:it.date}));
  }));
  rv.sort((a,b)=>(a.kind==="pendiente")-(b.kind==="pendiente")||cmp(a,b));
  S.imp.review=rv;S.imp.busy=false;render();
}

const t12=s=>{const a=s.split(":").map(Number),h=a[0]%12||12;return pad(h)+":"+pad(a[1])+" "+(a[0]<12?"AM":"PM")};
const plus60=s=>{const a=s.split(":").map(Number),m=Math.min(a[0]*60+a[1]+60,1439);return pad(Math.floor(m/60))+":"+pad(m%60)};
const us=s=>{const a=s.split("-");return a[1]+"/"+a[2]+"/"+a[0]};
const csvq=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
function buildCSV(list){
  const hdr=["Subject","Start Date","Start Time","End Date","End Time","All Day Event","Description","Private"];
  const rows=list.map(e=>{
    const all=!e.time;
    return [(T[e.type]||T.otro).label+": "+e.title,us(e.date),all?"":t12(e.time),us(endOf(e)),all?"":t12(plus60(e.time)),all?"True":"False",e.notes||"","False"];
  });
  return [hdr].concat(rows).map(r=>r.map(csvq).join(",")).join("\r\n");
}
async function exportCSV(){

function weekText(){

    case "delsrcgo":{
      const mine=S.events.filter(e=>e.sourceId===id);
      try{for(const e of mine)await ops().removeEvent(e.id);await ops().removeSource(id);closeModal();toast("Archivo quitado.")}catch(e){}break}
  }
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="q"){S.filter.q=t.value;render();return}
  if(t.dataset&&t.dataset.rv&&S.imp&&S.imp.review){
    const x=S.imp.review[+t.dataset.i];if(!x)return;
    const k=t.dataset.rv;
    if(k==="title")x.title=t.value;
    else if(k==="date"){x.date=t.value;x.uncertain=false}
    else if(k==="type"){x.type=t.value;t.closest(".rv").className="rv t-"+x.type+(x.on?"":" off")}
  }
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="fstatus"){S.filter.status=t.value;render();return}
  if(t.id==="kid"){S.kid=t.value.trim();if(!S.demo)Store.ops.saveKid(S.kid).catch(()=>{});render();return}
  if(t.id==="file"){handleFiles(t.files);t.value="";return}
  if(t.dataset&&t.dataset.rv==="on"&&S.imp&&S.imp.review){S.imp.review[+t.dataset.i].on=t.checked;render();return}
  if(t.dataset&&t.dataset.rv==="kind"&&S.imp&&S.imp.review){
    const x=S.imp.review[+t.dataset.i];if(!x)return;
    if(t.value==="pendiente"){x.kind="pendiente";x.dg=false}
    else{x.kind="evento";if(!validDate(x.date))x.date=validDate(x.pdate)?x.pdate:""}
    render();
  }
});
document.addEventListener("paste",e=>{
  if(HOSTED||!$("#modal").hidden)return;
  const f=[...((e.clipboardData&&e.clipboardData.files)||[])].filter(isImg);
  if(f.length){e.preventDefault();handleFiles(f)}
});
$("#kid").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur()});
let dragN=0;
const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes("Files");
window.addEventListener("dragenter",e=>{if(hasFiles(e)){e.preventDefault();dragN++;$("#dropveil").hidden=false}});
window.addEventListener("dragover",e=>{if(hasFiles(e))e.preventDefault()});
window.addEventListener("dragleave",e=>{if(hasFiles(e)){dragN=Math.max(0,dragN-1);if(!dragN)$("#dropveil").hidden=true}});
window.addEventListener("drop",e=>{if(hasFiles(e)){e.preventDefault();dragN=0;$("#dropveil").hidden=true;handleFiles(e.dataTransfer.files)}});

/* ---------- compartir ---------- */
function b64u(bytes){let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64u(t){t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";const s=atob(t),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
function hash36(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
async function packShare(){
  const from=addDays(today(),-7);
  const row=e=>[e.date||"",e.endDate||"",e.time||"",TYPES.findIndex(x=>x.id===e.type),e.title,e.notes||""];
  const dated=evs().filter(e=>endOf(e)>=from).sort(cmp).map(row),notes=openPend().sort(byNew).map(row);
  const rows=dated.concat(notes);
  const raw=new TextEncoder().encode(JSON.stringify({v:1,k:S.kid||"",t:Date.now(),e:rows}));
  if(window.CompressionStream){
    const cs=new CompressionStream("gzip"),w=cs.writable.getWriter();w.write(raw);w.close();
    return {n:rows.length,np:notes.length,hash:"g."+b64u(new Uint8Array(await new Response(cs.readable).arrayBuffer()))};
  }
  return {n:rows.length,np:notes.length,hash:"u."+b64u(raw)};
}
async function shareLink(){
  let p;try{p=await packShare()}catch(e){toast("No se pudo preparar el enlace.");return}
  if(!p.n){toast("No hay nada para compartir.");return}
  S.shareUrl=SHARE_BASE+"#d="+p.hash;
  openModal('<h2>Compartir calendario</h2><p>El enlace lleva adentro '+(p.n-p.np)+" "+plural(p.n-p.np,"actividad","actividades")+(p.np?" y "+p.np+" "+plural(p.np,"pendiente","pendientes"):"")+". Quien lo abra ve el calendario sin cuenta de Claude.</p>"+
    '<textarea id="m-link" readonly style="min-height:96px;font-size:12px">'+esc(S.shareUrl)+"</textarea>"+
    '<p class="st" style="margin-top:8px">El enlace incluye el nombre y las actividades: cualquiera que lo tenga puede verlas. Es una foto de hoy; si algo cambia, genera un enlace nuevo.</p>'+
    (S.shareUrl.length>6000?'<p class="st err">El enlace es largo. Si tu app de mensajes lo corta, quita actividades antiguas.</p>':"")+
    '<div class="btns"><button class="btn" data-act="close">Cerrar</button><button class="btn primary" data-act="copylink">Copiar enlace</button></div>');
}
async function copyLink(){
  try{await navigator.clipboard.writeText(S.shareUrl);toast("Enlace copiado.")}
  catch(e){const a=$("#m-link");if(a){a.focus();a.select()}toast("Selecciona el texto y cópialo.")}
}
async function importHash(){
  const m=/^#d=([gu])\.([A-Za-z0-9_-]+)$/.exec(location.hash);
  if(!m)return;
  try{
    let bytes=unb64u(m[2]);
    if(m[1]==="g"){
      if(!window.DecompressionStream)throw new Error("nodecomp");
      const ds=new DecompressionStream("gzip"),w=ds.writable.getWriter();w.write(bytes);w.close();
      bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer());
    }
    const j=JSON.parse(new TextDecoder().decode(bytes));
    if(!j||!Array.isArray(j.e))throw new Error("bad");
    if(+j.t&&+j.t===S.sharedAt&&S.shared.length)return;
    const seen={},list=[];
    j.e.slice(0,600).forEach(r=>{
      if(!Array.isArray(r)||typeof r[4]!=="string"||!r[4].trim())return;
      const und=!r[0];
      if(!und&&!validDate(r[0]))return;
      const base=(und?"p":"s")+hash36((und?"":r[0])+"|"+norm(r[4]));
      seen[base]=(seen[base]||0)+1;
      list.push({id:base+(seen[base]>1?"-"+seen[base]:""),title:r[4].trim().slice(0,120),date:und?"":r[0],endDate:!und&&validDate(r[1])&&r[1]>r[0]?r[1]:null,
        time:!und&&validTime(r[2])?r[2]:"",type:TYPES[r[3]]?TYPES[r[3]].id:"otro",notes:typeof r[5]==="string"?r[5].slice(0,400):""});
    });
    S.shared=list;S.sharedKid=typeof j.k==="string"?j.k.slice(0,40):"";S.sharedAt=+j.t||Date.now();S.kid=S.sharedKid;
    Object.keys(S.done).forEach(k=>{if(!list.some(x=>x.id===k))delete S.done[k]});
    hSave();
    toast("Calendario actualizado: "+list.length+" "+plural(list.length,"elemento","elementos")+".");
  }catch(e){toast("No pude abrir el enlace. Pide que te lo manden de nuevo.")}
}

/* ---------- arranque ---------- */
async function init(){
  if(HOSTED){
    S.mode="hosted";Store.ops=hostedOps;hLoad();
    dlFn={save:async o=>{const b=new Blob([o.data],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}};
    S.canDl=true;
    await importHash();
    window.addEventListener("hashchange",async()=>{await importHash();render()});
    S.loading=false;render();return;
  }
  render();
  let ok=false;
  try{
    if(window.claude&&claude.use){
      const r=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample"),claude.use("downloads")]);
      sampleFn=r[2];dlFn=r[3];
      S.canDl=!!dlFn;
      if(sampleFn){S.canAI=true;try{const l=await sampleFn.limits();S.imgMax=l&&l.images?l.images.maxCount:0}catch(e){}}
      const uid=r[1]&&r[1].id?await r[1].id():null;
      if(r[0]&&uid){
        Store.ops=makeDbOps(r[0],uid);S.mode="db";ok=true;
        Store.ops.subscribe();
        setTimeout(()=>{if(S.loading){S.loading=false;S.slow=true;render()}},10000);
      }
    }
  }catch(e){console.warn(e)}
  if(!ok){S.mode="local";lsLoad();S.loading=false;Store.ops=localOps}
  render();
}
init();
</script>
